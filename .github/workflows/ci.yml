name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    name: Build & Test (Debug-Dev)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[] | select(.key | test("iOS")) | .value[] | select(.name == "iPhone 17 Pro" and .isAvailable)] | .[0].udid // empty')
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | test("iOS")))] | last | .identifier // empty')
            if [ -z "$RUNTIME" ]; then echo "No iOS simulator runtime on this runner"; exit 1; fi
            UDID=$(xcrun simctl create "CI iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro" "$RUNTIME")
          fi
          echo "Using simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SecretGarden.xcodeproj \
            -scheme SecretGarden-Dev \
            -testPlan SecretGarden-Dev \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee test.log

      - name: Coverage summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo '### Coverage by target' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || echo "No coverage data" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test.log
          retention-days: 7
