name: Probe Runner
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Xcode đang có
        run: |
          ls -d /Applications/Xcode*
          xcodebuild -version
      - name: Simulator đang có
        run: xcrun simctl list devices available | grep -i "iphone 17"
